name: App Streamed Installer Validation

on:
  push:
    branches:
      - fix/app-stream-rootfs-install

permissions:
  contents: read

concurrency:
  group: app-streamed-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5.1.0

      - name: Set up Java 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test --no-pub --reporter expanded

      - name: Compile Android Debug APK
        run: |
          set -euo pipefail
          flutter build apk --debug --no-pub
          test -s build/app/outputs/flutter-apk/app-debug.apk

      - name: Run Android JVM unit tests
        run: |
          set -euo pipefail
          cd android
          ./gradlew testDebugUnitTest --no-daemon

      - name: Upload installable Debug APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: Bisho-IDE-debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
