plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace = "com.bisho.myapp"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    // Keep PRoot in Android's immutable APK native-library area (/data/app).
    // Android 10+ SELinux blocks execve() from writable app filesDir.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.bisho.myapp"
        minSdk = 24
        targetSdk = 34
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    signingConfigs {
        release {
            def signingStore = System.getenv("BISHO_RELEASE_STORE_FILE")
            def signingStorePassword = System.getenv("BISHO_RELEASE_STORE_PASSWORD")
            def signingKeyAlias = System.getenv("BISHO_RELEASE_KEY_ALIAS")
            def signingKeyPassword = System.getenv("BISHO_RELEASE_KEY_PASSWORD")
            if (signingStore && signingStorePassword && signingKeyAlias && signingKeyPassword) {
                storeFile = file(signingStore)
                storePassword = signingStorePassword
                keyAlias = signingKeyAlias
                keyPassword = signingKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            // Keep the test build installable beside the existing production app.
            applicationIdSuffix = ".test"
            versionNameSuffix = "-test"
        }
        release {
            def signingReady = System.getenv('BISHO_RELEASE_STORE_FILE') &&
                System.getenv('BISHO_RELEASE_STORE_PASSWORD') &&
                System.getenv('BISHO_RELEASE_KEY_ALIAS') &&
                System.getenv('BISHO_RELEASE_KEY_PASSWORD')
            if (!signingReady) {
                throw new GradleException('Stable release signing is required. Configure BISHO_RELEASE_KEYSTORE_BASE64, BISHO_RELEASE_STORE_PASSWORD, BISHO_RELEASE_KEY_ALIAS and BISHO_RELEASE_KEY_PASSWORD in GitHub Actions secrets.')
            }
            signingConfig = signingConfigs.release
        }
    }
}

dependencies {
    // Audited TAR/PAX/GZIP reader; extraction is additionally path- and size-bounded below.
    implementation "org.apache.commons:commons-compress:1.28.0"
    testImplementation "junit:junit:4.13.2"
}

flutter {
    source = "../.."
}
