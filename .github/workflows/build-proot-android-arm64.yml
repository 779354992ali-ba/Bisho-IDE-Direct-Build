name: Build upstream PRoot for Android ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pinned upstream source
        uses: actions/checkout@v4.4.0
        with:
          repository: proot-me/proot
          ref: v5.5.0
          path: upstream-proot
          fetch-depth: 1
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make pkg-config python3 curl file binutils

      - name: Install Android NDK
        uses: android-actions/setup-android@v4.0.2

      - name: Install pinned NDK side-by-side
        run: sdkmanager 'ndk;29.0.14206865'

      - name: Build Android ARM64 talloc and PRoot
        shell: bash
        run: |
          set -euo pipefail

          NDK="$ANDROID_SDK_ROOT/ndk/29.0.14206865"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          CLANG="$TOOLCHAIN/aarch64-linux-android24-clang"
          LLVM_AR="$TOOLCHAIN/llvm-ar"
          LLVM_RANLIB="$TOOLCHAIN/llvm-ranlib"
          LLVM_STRIP="$TOOLCHAIN/llvm-strip"
          LLVM_OBJCOPY="$TOOLCHAIN/llvm-objcopy"
          LLVM_OBJDUMP="$TOOLCHAIN/llvm-objdump"
          LD_CMD="$TOOLCHAIN/ld.lld"

          for tool in "$CLANG" "$LLVM_AR" "$LLVM_RANLIB" \
                      "$LLVM_STRIP" "$LLVM_OBJCOPY" \
                      "$LLVM_OBJDUMP" "$LD_CMD"; do
            test -x "$tool" || {
              echo "Missing Android NDK tool: $tool"
              exit 1
            }
          done

          mkdir -p "$GITHUB_WORKSPACE/out"
          TALLOC_PREFIX="$RUNNER_TEMP/talloc-prefix"
          TALLOC_VERSION="2.5.0"
          TALLOC_SHA256="912afa237510ae542a7733998eb18a12bcda35ab6729c8e2ddb43e8d0ebab007"

          mkdir -p "$TALLOC_PREFIX"

          cd "$RUNNER_TEMP"
          curl -fL --retry 3 \
            "https://www.samba.org/ftp/talloc/talloc-${TALLOC_VERSION}.tar.gz" \
            -o "talloc-${TALLOC_VERSION}.tar.gz"

          echo "$TALLOC_SHA256  talloc-${TALLOC_VERSION}.tar.gz" | sha256sum -c -

          tar -xzf "talloc-${TALLOC_VERSION}.tar.gz"
          cd "talloc-${TALLOC_VERSION}"

          cat > cross-answers.txt <<'ANSWERS'
          Checking uname sysname type: "Linux"
          Checking uname machine type: "dontcare"
          Checking uname release type: "dontcare"
          Checking uname version type: "dontcare"
          Checking simple C program: OK
          building library support: OK
          Checking for large file support: OK
          Checking for -D_FILE_OFFSET_BITS=64: OK
          Checking for WORDS_BIGENDIAN: OK
          Checking for C99 vsnprintf: OK
          Checking for HAVE_SECURE_MKSTEMP: OK
          rpath library support: OK
          -Wl,--version-script support: FAIL
          Checking correct behavior of strtoll: OK
          Checking correct behavior of strptime: OK
          Checking for HAVE_IFACE_GETIFADDRS: OK
          Checking for HAVE_IFACE_IFCONF: OK
          Checking for HAVE_IFACE_IFREQ: OK
          Checking getconf LFS_CFLAGS: OK
          Checking for large file support without additional flags: OK
          Checking for working strptime: OK
          Checking for HAVE_SHARED_MMAP: OK
          Checking for HAVE_MREMAP: OK
          Checking for HAVE_INCOHERENT_MMAP: OK
          Checking getconf large file support flags work: OK
          ANSWERS

          CC="$CLANG" \
          AR="$LLVM_AR" \
          RANLIB="$LLVM_RANLIB" \
          CFLAGS="-O2 -fPIC" \
          ./configure \
            --prefix="$TALLOC_PREFIX" \
            --disable-rpath \
            --disable-python \
            --cross-compile \
            --cross-answers=cross-answers.txt

          make -j2
          make install

          mkdir -p "$TALLOC_PREFIX/lib"
          shopt -s nullglob
          TALLOC_OBJECTS=(bin/default/talloc*.o)
          if ((${#TALLOC_OBJECTS[@]} < 1)); then
            echo "ERROR: No core Talloc object found."
            exit 1
          fi
          printf "Talloc objects found: %s\n" "${TALLOC_OBJECTS[@]}"
          rm -f "$TALLOC_PREFIX/lib/libtalloc.a"
          "$LLVM_AR" rcs "$TALLOC_PREFIX/lib/libtalloc.a" "${TALLOC_OBJECTS[@]}"
          "$LLVM_RANLIB" "$TALLOC_PREFIX/lib/libtalloc.a"
          # Force -ltalloc to resolve to the static archive.
          rm -f "$TALLOC_PREFIX/lib"/libtalloc.so*
          test -s "$TALLOC_PREFIX/include/talloc.h"
          test -s "$TALLOC_PREFIX/lib/libtalloc.a"
          test -s "$TALLOC_PREFIX/lib/pkgconfig/talloc.pc"

          export PKG_CONFIG_LIBDIR="$TALLOC_PREFIX/lib/pkgconfig"
          export PKG_CONFIG_PATH=""

          pkg-config --exists talloc
          pkg-config --modversion talloc
          pkg-config --cflags --libs talloc

          PROOT_SRC="$GITHUB_WORKSPACE/upstream-proot"

          MAKE_ARGS=(
            "CC=$CLANG"
            "LD=$CLANG"
            "LD_CMD=$LD_CMD"
            "STRIP=$LLVM_STRIP"
            "OBJCOPY=$LLVM_OBJCOPY"
            "OBJDUMP=$LLVM_OBJDUMP"
            "PKG_CONFIG=pkg-config"
            "WITHOUT_PYTHON=1"
          )

          make -C "$PROOT_SRC/src" -j2 \
            "${MAKE_ARGS[@]}" loader.elf build.h

          make -C "$PROOT_SRC/src" -j2 \
            "${MAKE_ARGS[@]}" proot V=1

          PROOT="$GITHUB_WORKSPACE/out/proot"
          install -D -m 0755 "$PROOT_SRC/src/proot" "$PROOT"

          test -s "$PROOT"

          echo "Checking Android ARM64 ELF architecture..."
          file "$PROOT" | grep -Eqi 'ARM aarch64|ARM64'
          readelf -h "$PROOT" | grep -E 'Machine:.*AArch64'

          echo "Checking Android dynamic linker..."
          readelf -lW "$PROOT" | grep -F '/system/bin/linker64'

          if readelf -d "$PROOT" | grep -q 'libtalloc.so'; then
            echo "ERROR: PRoot unexpectedly depends on shared libtalloc."
            exit 1
          fi

          echo "Android ARM64 PRoot build verification: PASS"
          sha256sum "$PROOT"
      - name: Record provenance and checksum
        run: |
          mkdir -p out
          git -C upstream-proot rev-parse HEAD > out/UPSTREAM_COMMIT.txt
          printf 'Upstream: https://github.com/proot-me/proot\nTag: v5.5.0\nNDK: 29.0.14206865\nTarget: aarch64-linux-android24\n' > out/BUILD_PROVENANCE.txt
          sha256sum out/proot > out/SHA256SUMS
          cp upstream-proot/COPYING out/UPSTREAM_COPYING 2>/dev/null || true
      - name: Upload build artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: bisho-proot-android-arm64-v5.5.0
          path: out/
          if-no-files-found: error
