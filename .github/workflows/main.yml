name: Build Flutter APK
# PRoot packaging is validated in the APK workflow before release.

on:
  push:
    branches:
      - fix/app-stream-rootfs-install
      - work/ten-phase-continuation
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter stable version'
        required: true
        default: '3.47.9'

permissions:
  contents: read
  actions: write

concurrency:
  group: bisho-ide-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-proot:
    name: Build pinned Android ARM64 PRoot
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout pinned Termux PRoot source
        uses: actions/checkout@v5.1.0
        with:
          repository: termux/proot
          ref: cd02c79e0ff84db3a22616e49ad44b0cc22ef4f2
          path: termux-proot
          fetch-depth: 0
      - name: Checkout pinned Android shared-memory helper
        uses: actions/checkout@v5.1.0
        with:
          repository: termux/libandroid-shmem
          ref: 7f0bd7e25dbdd146265aff7c6a890029e374622d
          path: libandroid-shmem
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make pkg-config python3 curl file binutils

      - name: Install pinned Android NDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK is not preinstalled on this runner}"
          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "ndk;29.0.14206865"

      - name: Build Android ARM64 talloc and PRoot
        shell: bash
        run: |
          set -euo pipefail

          NDK="$ANDROID_SDK_ROOT/ndk/29.0.14206865"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          CLANG="$TOOLCHAIN/aarch64-linux-android24-clang"
          CLANG26="$TOOLCHAIN/aarch64-linux-android26-clang"
          LLVM_AR="$TOOLCHAIN/llvm-ar"
          LLVM_RANLIB="$TOOLCHAIN/llvm-ranlib"
          LLVM_STRIP="$TOOLCHAIN/llvm-strip"
          LLVM_OBJCOPY="$TOOLCHAIN/llvm-objcopy"
          LLVM_OBJDUMP="$TOOLCHAIN/llvm-objdump"
          LD_CMD="$TOOLCHAIN/ld.lld"

          for tool in "$CLANG" "$CLANG26" "$LLVM_AR" "$LLVM_RANLIB" \
                      "$LLVM_STRIP" "$LLVM_OBJCOPY" \
                      "$LLVM_OBJDUMP" "$LD_CMD"; do
            test -x "$tool" || {
              echo "Missing Android NDK tool: $tool"
              exit 1
            }
          done

          mkdir -p "$GITHUB_WORKSPACE/out"
          TALLOC_PREFIX="$RUNNER_TEMP/talloc-prefix"
          TALLOC_VERSION="2.5.0"
          TALLOC_SHA256="912afa237510ae542a7733998eb18a12bcda35ab6729c8e2ddb43e8d0ebab007"

          mkdir -p "$TALLOC_PREFIX"

          cd "$RUNNER_TEMP"
          curl -fL --retry 3 \
            "https://www.samba.org/ftp/talloc/talloc-${TALLOC_VERSION}.tar.gz" \
            -o "talloc-${TALLOC_VERSION}.tar.gz"

          echo "$TALLOC_SHA256  talloc-${TALLOC_VERSION}.tar.gz" | sha256sum -c -

          tar -xzf "talloc-${TALLOC_VERSION}.tar.gz"
          cd "talloc-${TALLOC_VERSION}"

          cat > cross-answers.txt <<'ANSWERS'
          Checking uname sysname type: "Linux"
          Checking uname machine type: "dontcare"
          Checking uname release type: "dontcare"
          Checking uname version type: "dontcare"
          Checking simple C program: OK
          building library support: OK
          Checking for large file support: OK
          Checking for -D_FILE_OFFSET_BITS=64: OK
          Checking for WORDS_BIGENDIAN: OK
          Checking for C99 vsnprintf: OK
          Checking for HAVE_SECURE_MKSTEMP: OK
          rpath library support: OK
          -Wl,--version-script support: FAIL
          Checking correct behavior of strtoll: OK
          Checking correct behavior of strptime: OK
          Checking for HAVE_IFACE_GETIFADDRS: OK
          Checking for HAVE_IFACE_IFCONF: OK
          Checking for HAVE_IFACE_IFREQ: OK
          Checking getconf LFS_CFLAGS: OK
          Checking for large file support without additional flags: OK
          Checking for working strptime: OK
          Checking for HAVE_SHARED_MMAP: OK
          Checking for HAVE_MREMAP: OK
          Checking for HAVE_INCOHERENT_MMAP: OK
          Checking getconf large file support flags work: OK
          ANSWERS

          CC="$CLANG" \
          AR="$LLVM_AR" \
          RANLIB="$LLVM_RANLIB" \
          CFLAGS="-O2 -fPIC" \
          ./configure \
            --prefix="$TALLOC_PREFIX" \
            --disable-rpath \
            --disable-python \
            --cross-compile \
            --cross-answers=cross-answers.txt

          make -j2
          make install

          mkdir -p "$TALLOC_PREFIX/lib"
          shopt -s nullglob
          TALLOC_OBJECTS=(bin/default/talloc*.o)
          if ((${#TALLOC_OBJECTS[@]} < 1)); then
            echo "ERROR: No core Talloc object found."
            exit 1
          fi
          printf "Talloc objects found: %s\n" "${TALLOC_OBJECTS[@]}"

          REPLACE_OBJECT="bin/default/lib/replace/replace.c.1.o"
          if [[ ! -f "$REPLACE_OBJECT" ]]; then
            echo "ERROR: Talloc libreplace object not found: $REPLACE_OBJECT"
            exit 1
          fi

          if ! "$TOOLCHAIN/llvm-nm" -g --defined-only "$REPLACE_OBJECT" | grep -Eq '[[:space:]][Tt][[:space:]]+rep_memset_explicit$'; then
            echo "ERROR: Selected object does not define rep_memset_explicit."
            exit 1
          fi

          echo "Talloc replace object: $REPLACE_OBJECT"
          TALLOC_OBJECTS+=("$REPLACE_OBJECT")

          rm -f "$TALLOC_PREFIX/lib/libtalloc.a"
          "$LLVM_AR" rcs "$TALLOC_PREFIX/lib/libtalloc.a" "${TALLOC_OBJECTS[@]}"
          "$LLVM_RANLIB" "$TALLOC_PREFIX/lib/libtalloc.a"
          # Force -ltalloc to resolve to the static archive.
          rm -f "$TALLOC_PREFIX/lib"/libtalloc.so*
          test -s "$TALLOC_PREFIX/include/talloc.h"
          test -s "$TALLOC_PREFIX/lib/libtalloc.a"
          test -s "$TALLOC_PREFIX/lib/pkgconfig/talloc.pc"

          export PKG_CONFIG_LIBDIR="$TALLOC_PREFIX/lib/pkgconfig"
          export PKG_CONFIG_PATH=""

          pkg-config --exists talloc
          pkg-config --modversion talloc
          pkg-config --cflags --libs talloc

          PROOT_SRC="$GITHUB_WORKSPACE/termux-proot"
          SHMEM_SRC="$GITHUB_WORKSPACE/libandroid-shmem"
          SHMEM_PREFIX="$RUNNER_TEMP/android-shmem-prefix"
          mkdir -p "$SHMEM_PREFIX/lib" "$SHMEM_PREFIX/include/sys"

          # NDK bionic does not define Termux's _PATH_TMP. Use an explicit
          # app-owned writable directory supplied by BISHO_PROOT_TMPDIR.
          python3 - "$SHMEM_SRC/shmem.c" <<'PATCH_SHMEM'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()
          old_paths_include = "#include <paths.h>\n"
          if s.count(old_paths_include) != 1:
              raise SystemExit("ERROR: libandroid-shmem paths.h include mismatch.")
          s = s.replace(old_paths_include, "", 1)
          old_macro = '#define ASHV_KEY_SYMLINK_PATH _PATH_TMP "ashv_key_%d"'
          new_macro = '#define ASHV_KEY_SYMLINK_NAME "ashv_key_%d"'
          if s.count(old_macro) != 1:
              raise SystemExit("ERROR: libandroid-shmem temp-path macro mismatch.")
          s = s.replace(old_macro, new_macro, 1)

          old_socket_macro = '#define ANDROID_SHMEM_SOCKNAME "/dev/shm/%08x"'
          new_socket_macro = old_socket_macro + '\n#define ANDROID_SHMEM_FILE_SOCKNAME ".bisho_shmem_%08x-%d"'
          if s.count(old_socket_macro) != 1:
              raise SystemExit("ERROR: libandroid-shmem socket-path macro mismatch.")
          s = s.replace(old_socket_macro, new_socket_macro, 1)

          old_setup = '\tpthread_mutex_lock(&mutex);\n\tchar symlink_path[256];'
          new_setup = '''        pthread_mutex_lock(&mutex);
                  const char *tmp_dir = getenv("BISHO_PROOT_TMPDIR");
                  if (tmp_dir == NULL || tmp_dir[0] != '/')
                      tmp_dir = getenv("TMPDIR");
                  if (tmp_dir == NULL || tmp_dir[0] != '/')
                      tmp_dir = "/tmp";
                  if (access(tmp_dir, W_OK | X_OK) != 0) {
                      pthread_mutex_unlock(&mutex);
                      return -1;
                  }
                  size_t tmp_dir_len = strlen(tmp_dir);
                  char symlink_path[256];'''
          if s.count(old_setup) != 1:
              raise SystemExit("ERROR: libandroid-shmem temp directory setup mismatch.")
          s = s.replace(old_setup, new_setup, 1)

          old_call = '\t\tsprintf(symlink_path, ASHV_KEY_SYMLINK_PATH, key);'
          new_call = '''        int path_len = snprintf(symlink_path, sizeof(symlink_path),
                  "%s%s" ASHV_KEY_SYMLINK_NAME, tmp_dir,
                  tmp_dir_len > 0 && tmp_dir[tmp_dir_len - 1] == '/' ? "" : "/", key);
                  if (path_len < 0 || (size_t)path_len >= sizeof(symlink_path)) {
                      pthread_mutex_unlock(&mutex);
                      errno = ENAMETOOLONG;
                      return -1;
                  }'''
          if s.count(old_call) != 1:
              raise SystemExit("ERROR: libandroid-shmem symlink path call mismatch.")
          s = s.replace(old_call, new_call, 1)

          old_socket_call = '\tsprintf(buf, ANDROID_SHMEM_SOCKNAME "-%d", ashv_local_socket_id, idx);'
          new_socket_call = '''        int socket_path_len = snprintf(buf, sizeof(buf),
                  "%s%s" ANDROID_SHMEM_FILE_SOCKNAME, tmp_dir,
                  tmp_dir_len > 0 && tmp_dir[tmp_dir_len - 1] == '/' ? "" : "/",
                  ashv_local_socket_id, idx);
                  if (socket_path_len < 0 || (size_t)socket_path_len >= sizeof(buf)) {
                      pthread_mutex_unlock(&mutex);
                      errno = ENAMETOOLONG;
                      return -1;
                  }'''
          if s.count(old_socket_call) != 1:
              raise SystemExit("ERROR: libandroid-shmem socket path call mismatch.")
          s = s.replace(old_socket_call, new_socket_call, 1)
          p.write_text(s)
          PATCH_SHMEM
          grep -q 'BISHO_PROOT_TMPDIR' "$SHMEM_SRC/shmem.c"


          "$CLANG26" -O2 -fPIC -std=c11 -Wall -Wextra \
            -c "$SHMEM_SRC/shmem.c" -o "$SHMEM_PREFIX/shmem.o"
          "$LLVM_AR" rcs "$SHMEM_PREFIX/lib/libandroid-shmem.a" "$SHMEM_PREFIX/shmem.o"
          cp "$SHMEM_SRC/shm.h" "$SHMEM_PREFIX/include/sys/shm.h"

          export C_INCLUDE_PATH="$TALLOC_PREFIX/include:$SHMEM_PREFIX/include${C_INCLUDE_PATH:+:$C_INCLUDE_PATH}"
          export LIBRARY_PATH="$TALLOC_PREFIX/lib:$SHMEM_PREFIX/lib${LIBRARY_PATH:+:$LIBRARY_PATH}"
          export CPPFLAGS="-DARG_MAX=131072${CPPFLAGS:+ $CPPFLAGS}"

          test "$(git -C "$PROOT_SRC" rev-parse HEAD)" = "cd02c79e0ff84db3a22616e49ad44b0cc22ef4f2"
          grep -q 'case SIGSYS:' "$PROOT_SRC/src/tracee/event.c"
          test -s "$PROOT_SRC/src/tracee/seccomp.c"

          # The provisioned guest rootfs is ARM64-only; do not build a 32-bit loader.
          python3 - "$PROOT_SRC/src/arch.h" "$PROOT_SRC/src/GNUmakefile" "$PROOT_SRC/src/extension/ashmem_memfd/ashmem_memfd.c" <<'PATCH_PY'
          import sys
          from pathlib import Path

          arch = Path(sys.argv[1])
          s = arch.read_text()
          old = "    #define HAS_POKEDATA_WORKAROUND true\n\n    #define HAS_LOADER_32BIT true\n"
          new = "    #define HAS_POKEDATA_WORKAROUND true\n\n    /* Bisho packages an ARM64-only Linux guest rootfs. */\n    #undef HAS_LOADER_32BIT\n"
          if s.count(old) != 1:
              raise SystemExit("ERROR: ARM64 loader capability anchor mismatch.")
          arch.write_text(s.replace(old, new, 1))

          makefile = Path(sys.argv[2])
          s = makefile.read_text()
          old = "  LDFLAGS += -landroid-shmem"
          new = "  LDFLAGS += -landroid-shmem -llog -landroid"
          if s.count(old) != 1:
              raise SystemExit("ERROR: Android shared-memory linker anchor mismatch.")
          makefile.write_text(s.replace(old, new, 1))

          extension = Path(sys.argv[3])
          s = extension.read_text()
          old = "#include <stdlib.h>\n"
          new = "#include <stdlib.h>\n#include <string.h>\n"
          if s.count(old) != 1:
              raise SystemExit("ERROR: ashmem_memfd string.h include anchor mismatch.")
          extension.write_text(s.replace(old, new, 1))
          print("OK: pinned Termux SIGSYS/seccomp source, static Android shmem, ARM64-only loader, NDK29 header fix.")
          PATCH_PY

          MAKE_ARGS=(
            "CC=$CLANG26"
            "LD=$CLANG26"
            "LD_CMD=$LD_CMD"
            "STRIP=$LLVM_STRIP"
            "OBJCOPY=$LLVM_OBJCOPY"
            "OBJDUMP=$LLVM_OBJDUMP"
            "PKG_CONFIG=pkg-config"
            "LDFLAGS=-L$TALLOC_PREFIX/lib -L$SHMEM_PREFIX/lib -ltalloc -Wl,-z,noexecstack -landroid-shmem -llog -landroid"
            "WITHOUT_PYTHON=1"
            "PROOT_WITH_LIBANDROID_SHMEM=true"
          )

          make -C "$PROOT_SRC/src" -j2 "${MAKE_ARGS[@]}" build.h V=1
          grep -Fxq '#define HAVE_SECCOMP_FILTER' "$PROOT_SRC/src/build.h" || {
            echo "ERROR: Refusing PRoot artifact without compiled seccomp-filter support." >&2
            exit 1
          }
          make -C "$PROOT_SRC/src" -j2 "${MAKE_ARGS[@]}" proot V=1

          PROOT="$GITHUB_WORKSPACE/out/proot"
          install -D -m 0755 "$PROOT_SRC/src/proot" "$PROOT"

          test -s "$PROOT"

          echo "Checking Android ARM64 ELF architecture..."
          file "$PROOT" | grep -Eqi 'ARM aarch64|ARM64'
          readelf -h "$PROOT" | grep -E 'Machine:.*AArch64'

          echo "Checking Android dynamic linker..."
          readelf -lW "$PROOT" | grep -F '/system/bin/linker64'

          if readelf -d "$PROOT" | grep -Eq 'libtalloc|libandroid-shmem'; then
            echo "ERROR: PRoot unexpectedly depends on Termux-only shared libraries."
            exit 1
          fi

          echo "Android ARM64 PRoot build verification: PASS"
          sha256sum "$PROOT"
      - name: Record provenance and checksum
        run: |
          mkdir -p out
          git -C termux-proot rev-parse HEAD > out/UPSTREAM_COMMIT.txt
          printf 'Source: https://github.com/termux/proot\nTag: v5.1.107.80\nCommit: cd02c79e0ff84db3a22616e49ad44b0cc22ef4f2\nShared memory: termux/libandroid-shmem 7f0bd7e25dbdd146265aff7c6a890029e374622d (statically linked; BISHO_PROOT_TMPDIR app-sandbox patch)\nGuest ABI: ARM64 only\nNDK: 29.0.14206865\nTarget: aarch64-linux-android26\n' > out/BUILD_PROVENANCE.txt
          (cd out && sha256sum proot > SHA256SUMS && sha256sum -c SHA256SUMS)
          cp termux-proot/COPYING out/UPSTREAM_COPYING
          cp libandroid-shmem/LICENSE out/LIBANDROID_SHMEM_LICENSE
      - name: Upload build artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: bisho-proot-android-arm64-termux-v5.1.107.80
          path: out/
          if-no-files-found: error

  validate-and-build:
    needs: build-proot
    name: Validate and build one release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout source
        uses: actions/checkout@v5.1.0

      - name: Download verified PRoot build artifact
        uses: actions/download-artifact@v4.3.0
        with:
          name: bisho-proot-android-arm64-termux-v5.1.107.80
          path: build/proot-artifact

      - name: Stage PRoot as an APK native library
        shell: bash
        run: |
          set -euo pipefail
          test -s build/proot-artifact/proot
          test -s build/proot-artifact/SHA256SUMS
          (cd build/proot-artifact && sha256sum -c SHA256SUMS)
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          install -m 0755 build/proot-artifact/proot android/app/src/main/jniLibs/arm64-v8a/libproot.so
          file android/app/src/main/jniLibs/arm64-v8a/libproot.so | grep -Eqi 'ARM aarch64|ARM64'
          readelf -h android/app/src/main/jniLibs/arm64-v8a/libproot.so | grep -E 'Machine:.*AArch64'
          readelf -lW android/app/src/main/jniLibs/arm64-v8a/libproot.so | grep -F '/system/bin/linker64'
          echo "Verified PRoot staged at jniLibs/arm64-v8a/libproot.so"

      - name: Set up Java 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ inputs.flutter_version || '3.47.9' }}
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version
          java -version
          flutter doctor -v

      - name: Cache pub packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Resolve dependencies
        run: flutter pub get

      - name: Validate Android project files
        run: |
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/gradlew
          test -f android/app/src/main/kotlin/com/bisho/myapp/MainActivity.kt
          python3 - <<'PYXML'
          import xml.etree.ElementTree as ET
          ET.parse('android/app/src/main/AndroidManifest.xml')
          ET.parse('android/app/src/main/res/values/styles.xml')
          print('Android XML validation passed')
          PYXML

      - name: Prepare build diagnostics
        if: always()
        run: mkdir -p build/diagnostics

      - name: Analyze Dart source
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-pub --no-fatal-infos 2>&1 | tee build/diagnostics/analyze.log

      - name: Run unit and widget tests
        shell: bash
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded 2>&1 | tee build/diagnostics/tests.log

      - name: Build universal release APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --no-pub 2>&1 | tee build/diagnostics/apk-build.log

      - name: Verify APK and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          APK='build/app/outputs/flutter-apk/app-release.apk'
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='com.bisho.myapp' versionCode='100' versionName='1.0.1'"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libflutter.so"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libproot.so"
          unzip -p "$APK" lib/arm64-v8a/libproot.so > build/diagnostics/apk-libproot.so
          file build/diagnostics/apk-libproot.so | grep -Eqi 'ARM aarch64|ARM64'
          readelf -h build/diagnostics/apk-libproot.so | grep -E 'Machine:.*AArch64'
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libapp.so"
          unzip -l "$APK" | grep -E "classes[0-9]*[.]dex"
          echo "APK_IDENTITY_AND_ARM64_RUNTIME_VERIFIED"
          mkdir -p build/release-artifact
          cp "$APK" build/release-artifact/app-release.apk
          cd build/release-artifact
          sha256sum app-release.apk | tee SHA256SUMS.txt
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "flutter_version=$(flutter --version --machine | python3 -c 'import json,sys; print(json.load(sys.stdin)["frameworkVersion"])')"
            echo "built_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > BUILD_INFO.txt
          ls -lh app-release.apk SHA256SUMS.txt BUILD_INFO.txt

      - name: Upload release APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: Bisho-IDE-Release-APK
          path: |
            build/release-artifact/app-release.apk
            build/release-artifact/SHA256SUMS.txt
            build/release-artifact/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14

      - name: Create build diagnostics report
        if: always()
        shell: bash
        run: |
          mkdir -p build/diagnostics
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "job_status=${{ job.status }}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "finished_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo '--- Toolchain ---'
            flutter --version 2>&1 || true
            dart --version 2>&1 || true
            java -version 2>&1 || true
          } > build/diagnostics/BUILD_DIAGNOSTICS.txt
          echo "Run URL: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> build/diagnostics/BUILD_DIAGNOSTICS.txt

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: Bisho-IDE-Build-Diagnostics
          path: build/diagnostics/
          if-no-files-found: warn
