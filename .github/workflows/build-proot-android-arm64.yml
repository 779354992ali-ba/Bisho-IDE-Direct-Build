name: Build Termux-compatible PRoot for Android ARM64

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pinned Termux PRoot source
        uses: actions/checkout@v4.4.0
        with:
          repository: termux/proot
          ref: cd02c79e0ff84db3a22616e49ad44b0cc22ef4f2
          path: termux-proot
          fetch-depth: 0
      - name: Checkout pinned Android shared-memory helper
        uses: actions/checkout@v4.4.0
        with:
          repository: termux/libandroid-shmem
          ref: 7f0bd7e25dbdd146265aff7c6a890029e374622d
          path: libandroid-shmem
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make pkg-config python3 curl file binutils

      - name: Install Android NDK
        uses: android-actions/setup-android@v4.0.2

      - name: Install pinned NDK side-by-side
        run: sdkmanager 'ndk;29.0.14206865'

      - name: Build Android ARM64 talloc and PRoot
        shell: bash
        run: |
          set -euo pipefail

          NDK="$ANDROID_SDK_ROOT/ndk/29.0.14206865"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          CLANG="$TOOLCHAIN/aarch64-linux-android24-clang"
          CLANG26="$TOOLCHAIN/aarch64-linux-android26-clang"
          LLVM_AR="$TOOLCHAIN/llvm-ar"
          LLVM_RANLIB="$TOOLCHAIN/llvm-ranlib"
          LLVM_STRIP="$TOOLCHAIN/llvm-strip"
          LLVM_OBJCOPY="$TOOLCHAIN/llvm-objcopy"
          LLVM_OBJDUMP="$TOOLCHAIN/llvm-objdump"
          LD_CMD="$TOOLCHAIN/ld.lld"

          for tool in "$CLANG" "$CLANG26" "$LLVM_AR" "$LLVM_RANLIB" \
                      "$LLVM_STRIP" "$LLVM_OBJCOPY" \
                      "$LLVM_OBJDUMP" "$LD_CMD"; do
            test -x "$tool" || {
              echo "Missing Android NDK tool: $tool"
              exit 1
            }
          done

          mkdir -p "$GITHUB_WORKSPACE/out"
          TALLOC_PREFIX="$RUNNER_TEMP/talloc-prefix"
          TALLOC_VERSION="2.5.0"
          TALLOC_SHA256="912afa237510ae542a7733998eb18a12bcda35ab6729c8e2ddb43e8d0ebab007"

          mkdir -p "$TALLOC_PREFIX"

          cd "$RUNNER_TEMP"
          curl -fL --retry 3 \
            "https://www.samba.org/ftp/talloc/talloc-${TALLOC_VERSION}.tar.gz" \
            -o "talloc-${TALLOC_VERSION}.tar.gz"

          echo "$TALLOC_SHA256  talloc-${TALLOC_VERSION}.tar.gz" | sha256sum -c -

          tar -xzf "talloc-${TALLOC_VERSION}.tar.gz"
          cd "talloc-${TALLOC_VERSION}"

          cat > cross-answers.txt <<'ANSWERS'
          Checking uname sysname type: "Linux"
          Checking uname machine type: "dontcare"
          Checking uname release type: "dontcare"
          Checking uname version type: "dontcare"
          Checking simple C program: OK
          building library support: OK
          Checking for large file support: OK
          Checking for -D_FILE_OFFSET_BITS=64: OK
          Checking for WORDS_BIGENDIAN: OK
          Checking for C99 vsnprintf: OK
          Checking for HAVE_SECURE_MKSTEMP: OK
          rpath library support: OK
          -Wl,--version-script support: FAIL
          Checking correct behavior of strtoll: OK
          Checking correct behavior of strptime: OK
          Checking for HAVE_IFACE_GETIFADDRS: OK
          Checking for HAVE_IFACE_IFCONF: OK
          Checking for HAVE_IFACE_IFREQ: OK
          Checking getconf LFS_CFLAGS: OK
          Checking for large file support without additional flags: OK
          Checking for working strptime: OK
          Checking for HAVE_SHARED_MMAP: OK
          Checking for HAVE_MREMAP: OK
          Checking for HAVE_INCOHERENT_MMAP: OK
          Checking getconf large file support flags work: OK
          ANSWERS

          CC="$CLANG" \
          AR="$LLVM_AR" \
          RANLIB="$LLVM_RANLIB" \
          CFLAGS="-O2 -fPIC" \
          ./configure \
            --prefix="$TALLOC_PREFIX" \
            --disable-rpath \
            --disable-python \
            --cross-compile \
            --cross-answers=cross-answers.txt

          make -j2
          make install

          mkdir -p "$TALLOC_PREFIX/lib"
          shopt -s nullglob
          TALLOC_OBJECTS=(bin/default/talloc*.o)
          if ((${#TALLOC_OBJECTS[@]} < 1)); then
            echo "ERROR: No core Talloc object found."
            exit 1
          fi
          printf "Talloc objects found: %s\n" "${TALLOC_OBJECTS[@]}"

          REPLACE_OBJECT="bin/default/lib/replace/replace.c.1.o"
          if [[ ! -f "$REPLACE_OBJECT" ]]; then
            echo "ERROR: Talloc libreplace object not found: $REPLACE_OBJECT"
            exit 1
          fi

          if ! "$TOOLCHAIN/llvm-nm" -g --defined-only "$REPLACE_OBJECT" | grep -Eq '[[:space:]][Tt][[:space:]]+rep_memset_explicit$'; then
            echo "ERROR: Selected object does not define rep_memset_explicit."
            exit 1
          fi

          echo "Talloc replace object: $REPLACE_OBJECT"
          TALLOC_OBJECTS+=("$REPLACE_OBJECT")

          rm -f "$TALLOC_PREFIX/lib/libtalloc.a"
          "$LLVM_AR" rcs "$TALLOC_PREFIX/lib/libtalloc.a" "${TALLOC_OBJECTS[@]}"
          "$LLVM_RANLIB" "$TALLOC_PREFIX/lib/libtalloc.a"
          # Force -ltalloc to resolve to the static archive.
          rm -f "$TALLOC_PREFIX/lib"/libtalloc.so*
          test -s "$TALLOC_PREFIX/include/talloc.h"
          test -s "$TALLOC_PREFIX/lib/libtalloc.a"
          test -s "$TALLOC_PREFIX/lib/pkgconfig/talloc.pc"

          export PKG_CONFIG_LIBDIR="$TALLOC_PREFIX/lib/pkgconfig"
          export PKG_CONFIG_PATH=""

          pkg-config --exists talloc
          pkg-config --modversion talloc
          pkg-config --cflags --libs talloc

          PROOT_SRC="$GITHUB_WORKSPACE/termux-proot"
          SHMEM_SRC="$GITHUB_WORKSPACE/libandroid-shmem"
          SHMEM_PREFIX="$RUNNER_TEMP/android-shmem-prefix"
          mkdir -p "$SHMEM_PREFIX/lib" "$SHMEM_PREFIX/include/sys"

          # NDK bionic does not define Termux's _PATH_TMP. Use an explicit
          # app-owned writable directory supplied by BISHO_PROOT_TMPDIR.
          python3 - "$SHMEM_SRC/shmem.c" <<'PATCH_SHMEM'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()
          old_macro = '#define ASHV_KEY_SYMLINK_PATH _PATH_TMP "ashv_key_%d"'
          new_macro = '#define ASHV_KEY_SYMLINK_NAME "ashv_key_%d"'
          if s.count(old_macro) != 1:
              raise SystemExit("ERROR: libandroid-shmem temp-path macro mismatch.")
          s = s.replace(old_macro, new_macro, 1)

          old_socket_macro = '#define ANDROID_SHMEM_SOCKNAME "/dev/shm/%08x"'
          new_socket_macro = '#define ANDROID_SHMEM_SOCKET_NAME ".bisho_shmem_%08x-%d"'
          if s.count(old_socket_macro) != 1:
              raise SystemExit("ERROR: libandroid-shmem socket-path macro mismatch.")
          s = s.replace(old_socket_macro, new_socket_macro, 1)

          old_setup = '\tpthread_mutex_lock(&mutex);\n\tchar symlink_path[256];'
          new_setup = '''        pthread_mutex_lock(&mutex);
                  const char *tmp_dir = getenv("BISHO_PROOT_TMPDIR");
                  if (tmp_dir == NULL || tmp_dir[0] != '/')
                      tmp_dir = getenv("TMPDIR");
                  if (tmp_dir == NULL || tmp_dir[0] != '/')
                      tmp_dir = "/tmp";
                  if (access(tmp_dir, W_OK | X_OK) != 0) {
                      pthread_mutex_unlock(&mutex);
                      return -1;
                  }
                  size_t tmp_dir_len = strlen(tmp_dir);
                  char symlink_path[256];'''
          if s.count(old_setup) != 1:
              raise SystemExit("ERROR: libandroid-shmem temp directory setup mismatch.")
          s = s.replace(old_setup, new_setup, 1)

          old_call = '\t\tsprintf(symlink_path, ASHV_KEY_SYMLINK_PATH, key);'
          new_call = '''        int path_len = snprintf(symlink_path, sizeof(symlink_path),
                  "%s%s" ASHV_KEY_SYMLINK_NAME, tmp_dir,
                  tmp_dir_len > 0 && tmp_dir[tmp_dir_len - 1] == '/' ? "" : "/", key);
                  if (path_len < 0 || (size_t)path_len >= sizeof(symlink_path)) {
                      pthread_mutex_unlock(&mutex);
                      errno = ENAMETOOLONG;
                      return -1;
                  }'''
          if s.count(old_call) != 1:
              raise SystemExit("ERROR: libandroid-shmem symlink path call mismatch.")
          s = s.replace(old_call, new_call, 1)

          old_socket_call = '\tsprintf(buf, ANDROID_SHMEM_SOCKNAME "-%d", ashv_local_socket_id, idx);'
          new_socket_call = '''        int socket_path_len = snprintf(buf, sizeof(buf),
                  "%s%s" ANDROID_SHMEM_SOCKET_NAME, tmp_dir,
                  tmp_dir_len > 0 && tmp_dir[tmp_dir_len - 1] == '/' ? "" : "/",
                  ashv_local_socket_id, idx);
                  if (socket_path_len < 0 || (size_t)socket_path_len >= sizeof(buf)) {
                      pthread_mutex_unlock(&mutex);
                      errno = ENAMETOOLONG;
                      return -1;
                  }'''
          if s.count(old_socket_call) != 1:
              raise SystemExit("ERROR: libandroid-shmem socket path call mismatch.")
          s = s.replace(old_socket_call, new_socket_call, 1)
          p.write_text(s)
          PATCH_SHMEM
          grep -q 'BISHO_PROOT_TMPDIR' "$SHMEM_SRC/shmem.c"

          # Android NDK does not define _PATH_TMP; resolve the writable app/Termux temp path at runtime.
          python3 - "$SHMEM_SRC/shmem.c" <<'SHMEM_PATCH'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          source = path.read_text()
          for old, new in (
              ("#include <paths.h>\n", ""),
              ('#define ASHV_KEY_SYMLINK_PATH _PATH_TMP "ashv_key_%d"\n', ""),
          ):
              if source.count(old) != 1:
                  raise SystemExit(f"ERROR: libandroid-shmem anchor mismatch: {old!r}")
              source = source.replace(old, new, 1)

          anchor = "static pthread_mutex_t mutex = PTHREAD_MUTEX_INITIALIZER;\n"
          helper = r"""
          static int ashv_key_symlink_path(char *buffer, size_t buffer_size, key_t key)
          {
              const char *tmpdir = getenv("BISHO_PROOT_TMPDIR");
              const char *separator;
              int written;

              if (tmpdir == NULL || tmpdir[0] == '\0') {
                  tmpdir = getenv("TMPDIR");
              }
              if (tmpdir == NULL || tmpdir[0] != '/') {
                  errno = ENOENT;
                  return -1;
              }
              if (access(tmpdir, W_OK | X_OK) != 0) {
                  return -1;
              }

              size_t length = strlen(tmpdir);
              separator = (length > 0 && tmpdir[length - 1] == '/') ? "" : "/";
              written = snprintf(buffer, buffer_size, "%s%sashv_key_%d",
                                 tmpdir, separator, (int) key);
              if (written < 0) {
                  errno = EINVAL;
                  return -1;
              }
              if ((size_t) written >= buffer_size) {
                  errno = ENAMETOOLONG;
                  return -1;
              }
              return 0;
          }
          """
          if source.count(anchor) != 1:
              raise SystemExit("ERROR: libandroid-shmem mutex insertion anchor mismatch.")
          source = source.replace(anchor, anchor + helper + "\n", 1)

          old = "\t\tsprintf(symlink_path, ASHV_KEY_SYMLINK_PATH, key);\n"
          new = (
              "\t\tif (ashv_key_symlink_path(symlink_path, sizeof(symlink_path), key) != 0) {\n"
              "\t\t\tpthread_mutex_unlock(&mutex);\n"
              "\t\t\treturn -1;\n"
              "\t\t}\n"
          )
          if source.count(old) != 1:
              raise SystemExit("ERROR: libandroid-shmem symlink-path call anchor mismatch.")
          source = source.replace(old, new, 1)
          path.write_text(source)
          print("OK: libandroid-shmem uses writable BISHO_PROOT_TMPDIR/TMPDIR; no hard-coded _PATH_TMP.")
          SHMEM_PATCH

          "$CLANG26" -O2 -fPIC -std=c11 -Wall -Wextra \
            -c "$SHMEM_SRC/shmem.c" -o "$SHMEM_PREFIX/shmem.o"
          "$LLVM_AR" rcs "$SHMEM_PREFIX/lib/libandroid-shmem.a" "$SHMEM_PREFIX/shmem.o"
          cp "$SHMEM_SRC/shm.h" "$SHMEM_PREFIX/include/sys/shm.h"

          export C_INCLUDE_PATH="$TALLOC_PREFIX/include:$SHMEM_PREFIX/include${C_INCLUDE_PATH:+:$C_INCLUDE_PATH}"
          export LIBRARY_PATH="$TALLOC_PREFIX/lib:$SHMEM_PREFIX/lib${LIBRARY_PATH:+:$LIBRARY_PATH}"
          export CPPFLAGS="-DARG_MAX=131072${CPPFLAGS:+ $CPPFLAGS}"

          test "$(git -C "$PROOT_SRC" rev-parse HEAD)" = "cd02c79e0ff84db3a22616e49ad44b0cc22ef4f2"
          grep -q 'case SIGSYS:' "$PROOT_SRC/src/tracee/event.c"
          test -s "$PROOT_SRC/src/tracee/seccomp.c"

          # The provisioned guest rootfs is ARM64-only; do not build a 32-bit loader.
          python3 - "$PROOT_SRC/src/arch.h" "$PROOT_SRC/src/GNUmakefile" <<'PATCH_PY'
          import sys
          from pathlib import Path

          arch = Path(sys.argv[1])
          s = arch.read_text()
          old = "    #define HAS_POKEDATA_WORKAROUND true\n\n    #define HAS_LOADER_32BIT true\n"
          new = "    #define HAS_POKEDATA_WORKAROUND true\n\n    /* Bisho packages an ARM64-only Linux guest rootfs. */\n    #undef HAS_LOADER_32BIT\n"
          if s.count(old) != 1:
              raise SystemExit("ERROR: ARM64 loader capability anchor mismatch.")
          arch.write_text(s.replace(old, new, 1))

          makefile = Path(sys.argv[2])
          s = makefile.read_text()
          old = "  LDFLAGS += -landroid-shmem"
          new = "  LDFLAGS += -landroid-shmem -llog -landroid"
          if s.count(old) != 1:
              raise SystemExit("ERROR: Android shared-memory linker anchor mismatch.")
          makefile.write_text(s.replace(old, new, 1))
          print("OK: pinned Termux SIGSYS/seccomp source, static Android shmem, ARM64-only loader.")
          PATCH_PY

          MAKE_ARGS=(
            "CC=$CLANG"
            "LD=$CLANG"
            "LD_CMD=$LD_CMD"
            "STRIP=$LLVM_STRIP"
            "OBJCOPY=$LLVM_OBJCOPY"
            "OBJDUMP=$LLVM_OBJDUMP"
            "PKG_CONFIG=pkg-config"
            "WITHOUT_PYTHON=1"
            "PROOT_WITH_LIBANDROID_SHMEM=true"
          )

          make -C "$PROOT_SRC/src" -j2 "${MAKE_ARGS[@]}" build.h
          make -C "$PROOT_SRC/src" -j2 "${MAKE_ARGS[@]}" proot V=1

          PROOT="$GITHUB_WORKSPACE/out/proot"
          install -D -m 0755 "$PROOT_SRC/src/proot" "$PROOT"

          test -s "$PROOT"

          echo "Checking Android ARM64 ELF architecture..."
          file "$PROOT" | grep -Eqi 'ARM aarch64|ARM64'
          readelf -h "$PROOT" | grep -E 'Machine:.*AArch64'

          echo "Checking Android dynamic linker..."
          readelf -lW "$PROOT" | grep -F '/system/bin/linker64'

          if readelf -d "$PROOT" | grep -Eq 'libtalloc|libandroid-shmem'; then
            echo "ERROR: PRoot unexpectedly depends on Termux-only shared libraries."
            exit 1
          fi

          echo "Android ARM64 PRoot build verification: PASS"
          sha256sum "$PROOT"
      - name: Record provenance and checksum
        run: |
          mkdir -p out
          git -C termux-proot rev-parse HEAD > out/UPSTREAM_COMMIT.txt
          printf 'Source: https://github.com/termux/proot\nTag: v5.1.107.80\nCommit: cd02c79e0ff84db3a22616e49ad44b0cc22ef4f2\nShared memory: termux/libandroid-shmem 7f0bd7e25dbdd146265aff7c6a890029e374622d (statically linked; BISHO_PROOT_TMPDIR app-sandbox patch)\nGuest ABI: ARM64 only\nNDK: 29.0.14206865\nTarget: aarch64-linux-android24\n' > out/BUILD_PROVENANCE.txt
          sha256sum out/proot > out/SHA256SUMS
          cp termux-proot/COPYING out/UPSTREAM_COPYING
      - name: Upload build artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: bisho-proot-android-arm64-termux-v5.1.107.80
          path: out/
          if-no-files-found: error
