name: Provision Bisho Flutter ARM64 Local Engine

on:
  workflow_dispatch:
    inputs:
      accept_android_sdk_licenses:
        description: "I have reviewed and explicitly accept the applicable Android SDK license terms"
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: bisho-arm64-engine-provision
  cancel-in-progress: false

jobs:
  build-proot:
    uses: ./.github/workflows/build-proot-android-arm64.yml
    permissions:
      contents: read

  provision:
    needs: build-proot
    name: Provision and smoke-test Linux ARM64 Flutter runtime
    # Native ARM64 is required: Flutter/Dart and Android host tools must execute,
    # not merely pass an ELF architecture check.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Require explicit Android SDK license acceptance
        shell: bash
        env:
          LICENSE_ACCEPTED: ${{ inputs.accept_android_sdk_licenses }}
        run: |
          set -euo pipefail
          if [[ "$LICENSE_ACCEPTED" != "true" ]]; then
            echo "::error::Review the Android SDK license terms. Re-run manually only after explicitly accepting them."
            exit 1
          fi

      - name: Checkout Bisho source
        uses: actions/checkout@v5.1.0

      - name: Install ARM64 rootfs provisioning tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y debootstrap file binutils curl git unzip xz-utils zip

      - name: Download Android PRoot artifact built in this workflow run
        uses: actions/download-artifact@v4.3.0
        with:
          name: bisho-proot-android-arm64-termux-v5.1.107.80
          path: ${{ runner.temp }}/proot-artifact

      - name: Verify pinned PRoot artifact provenance
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/proot-artifact/proot"
          (
            cd "$RUNNER_TEMP/proot-artifact"
            sha256sum -c SHA256SUMS
            grep -Fxq "cd02c79e0ff84db3a22616e49ad44b0cc22ef4f2" UPSTREAM_COMMIT.txt
            grep -Fq "Source: https://github.com/termux/proot" BUILD_PROVENANCE.txt
            grep -Fq "Tag: v5.1.107.80" BUILD_PROVENANCE.txt
            grep -Fq "Commit: cd02c79e0ff84db3a22616e49ad44b0cc22ef4f2" BUILD_PROVENANCE.txt
            test -s UPSTREAM_COPYING
          )

      - name: Bootstrap Ubuntu 24.04 ARM64 guest rootfs
        shell: bash
        run: |
          set -euo pipefail
          ROOTFS="$RUNNER_TEMP/bisho-engine/rootfs"
          sudo mkdir -p "$ROOTFS"
          sudo debootstrap --arch=arm64 --variant=minbase noble "$ROOTFS" http://ports.ubuntu.com/ubuntu-ports
          # Use a reachable runner resolver while provisioning; never ship this host-specific file.
          RESOLV_CONF="$(readlink -f /etc/resolv.conf)"
          if grep -Eq '^[[:space:]]*nameserver[[:space:]]+127\.(0\.0\.1|0\.0\.0\.53)' "$RESOLV_CONF"; then
            for candidate in /run/systemd/resolve/resolv.conf /run/NetworkManager/resolv.conf; do
              if [[ -s "$candidate" ]] && grep -Eq '^[[:space:]]*nameserver[[:space:]]+' "$candidate" && ! grep -Eq '^[[:space:]]*nameserver[[:space:]]+127\.(0\.0\.1|0\.0\.0\.53)' "$candidate"; then
                RESOLV_CONF="$candidate"; break
              fi
            done
          fi
          grep -Eq '^[[:space:]]*nameserver[[:space:]]+' "$RESOLV_CONF" || { echo "No usable runner DNS resolver found." >&2; exit 1; }
          ! grep -Eq '^[[:space:]]*nameserver[[:space:]]+127\.(0\.0\.1|0\.0\.0\.53)' "$RESOLV_CONF" || { echo "Runner resolver is loopback-only; refusing to build a network-dependent rootfs." >&2; exit 1; }
          sudo rm -f "$ROOTFS/etc/resolv.conf"
          sudo install -m 0644 "$RESOLV_CONF" "$ROOTFS/etc/resolv.conf"
          sudo mount --bind /dev "$ROOTFS/dev"
          sudo mount -t proc proc "$ROOTFS/proc"
          sudo chroot "$ROOTFS" /usr/bin/env DEBIAN_FRONTEND=noninteractive apt-get update
          sudo chroot "$ROOTFS" /usr/bin/env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git unzip xz-utils zip file binutils python3 \
            openjdk-17-jdk libc6 libstdc++6 bash coreutils findutils grep sed
          # Stable JAVA_HOME expected by the engine packer.
          sudo ln -sfn /usr/lib/jvm/java-17-openjdk-arm64 "$ROOTFS/usr/lib/jvm/java-17"

      - name: Install pinned Flutter, Dart, Android SDK and ARM64 build tools
        shell: bash
        run: |
          set -euo pipefail
          ROOTFS="$RUNNER_TEMP/bisho-engine/rootfs"
          FLUTTER_COMMIT="d8a9f9a52e5af486f80d932e838ee93861ffd863"
          SDK_URL="https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip"
          SDK_META="$RUNNER_TEMP/repository2-3.xml"
          SDK_ZIP="$RUNNER_TEMP/commandlinetools.zip"
          SDK="$ROOTFS/opt/android-sdk"
          FLUTTER="$ROOTFS/opt/flutter"

          sudo mkdir -p "$ROOTFS/opt" "$SDK" "$ROOTFS/root/.cache"
          sudo git clone --filter=blob:none https://github.com/flutter/flutter.git "$FLUTTER"
          sudo git -C "$FLUTTER" fetch --depth 1 origin "$FLUTTER_COMMIT"
          sudo git -C "$FLUTTER" checkout --detach "$FLUTTER_COMMIT"
          sudo chroot "$ROOTFS" /usr/bin/env HOME=/root PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            /opt/flutter/bin/flutter --version
          sudo chroot "$ROOTFS" /usr/bin/env HOME=/root PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            /opt/flutter/bin/flutter precache --android

          # Resolve Google's published checksum for this exact command-line-tools archive.
          curl -fsSL https://dl.google.com/android/repository/repository2-3.xml -o "$SDK_META"
          python3 - "$SDK_META" <<'PY' > "$RUNNER_TEMP/sdk-tools.sha1"
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          wanted = "commandlinetools-linux-14742923_latest.zip"
          def local(tag):
              return tag.rsplit("}", 1)[-1]
          found = []
          for archive in root.iter():
              if local(archive.tag) != "archive":
                  continue
              complete = next((x for x in archive if local(x.tag) == "complete"), None)
              if complete is None:
                  continue
              url = next((x for x in complete if local(x.tag) == "url"), None)
              checksum = next((x for x in complete if local(x.tag) == "checksum"), None)
              if url is not None and url.text == wanted and checksum is not None and checksum.attrib.get("type") == "sha1":
                  found.append(checksum.text.strip())
          if len(set(found)) != 1:
              raise SystemExit("Google repository metadata did not provide one unambiguous SHA-1 for the pinned command-line-tools archive")
          print(found[0])
          PY
          curl -fL --retry 3 "$SDK_URL" -o "$SDK_ZIP"
          echo "$(cat "$RUNNER_TEMP/sdk-tools.sha1")  $SDK_ZIP" | sha1sum -c -
          sudo mkdir -p "$RUNNER_TEMP/sdk-tools-extract" "$SDK/cmdline-tools"
          sudo unzip -q "$SDK_ZIP" -d "$RUNNER_TEMP/sdk-tools-extract"
          sudo mv "$RUNNER_TEMP/sdk-tools-extract/cmdline-tools" "$SDK/cmdline-tools/latest"

          # This workflow can accept licenses only because the dispatcher explicitly
          # checked the required boolean input above; it never fabricates license files.
          sudo chroot "$ROOTFS" /usr/bin/env HOME=/root JAVA_HOME=/usr/lib/jvm/java-17-openjdk-arm64 ANDROID_HOME=/opt/android-sdk ANDROID_SDK_ROOT=/opt/android-sdk \
            PATH=/opt/android-sdk/cmdline-tools/latest/bin:/usr/bin:/bin bash -lc \
            'yes | sdkmanager --sdk_root=/opt/android-sdk --licenses'
          sudo chroot "$ROOTFS" /usr/bin/env HOME=/root JAVA_HOME=/usr/lib/jvm/java-17-openjdk-arm64 ANDROID_HOME=/opt/android-sdk ANDROID_SDK_ROOT=/opt/android-sdk \
            PATH=/opt/android-sdk/cmdline-tools/latest/bin:/usr/bin:/bin \
            sdkmanager --sdk_root=/opt/android-sdk platform-tools 'platforms;android-35' 'build-tools;35.0.1'

          # Download individually pinned Android ARM64 build-tools executables.
          TOOLS_URL="https://github.com/Commit451/android-arm-build-tools/releases/download/platform-tools-35.0.1"
          mkdir -p "$RUNNER_TEMP/arm-tools"
          declare -A TOOL_SHA256=(
            [aapt2]="c57d02d2986d7d68147d74525ad8a5fbb105f12723b33f1ce9eab12acd238cf0"
            [aidl]="9ae2dfac8ff49f34d493c2fd3d96f6153563f2ec0f07d18f6f661d0e8403d6a2"
            [zipalign]="d0688e26a0960b010c9702c4a4f6e53308d239a618b1dd0e5d0f4c5ad1c84fe6"
            [split-select]="172ecf6c4e93cc6f80a544f48b9a8fe770dd67f83b2f277504291cb4d1b82e3e"
          )
          for tool in aapt2 aidl zipalign split-select; do
            curl -fL --retry 3 "$TOOLS_URL/$tool" -o "$RUNNER_TEMP/arm-tools/$tool"
            echo "${TOOL_SHA256[$tool]}  $RUNNER_TEMP/arm-tools/$tool" | sha256sum -c -
            sudo install -m 0755 "$RUNNER_TEMP/arm-tools/$tool" "$SDK/build-tools/35.0.1/$tool"
          done
          sudo chroot "$ROOTFS" /usr/bin/env HOME=/root JAVA_HOME=/usr/lib/jvm/java-17-openjdk-arm64 ANDROID_HOME=/opt/android-sdk ANDROID_SDK_ROOT=/opt/android-sdk \
            PATH=/opt/flutter/bin:/opt/android-sdk/cmdline-tools/latest/bin:/opt/android-sdk/platform-tools:/usr/lib/jvm/java-17-openjdk-arm64/bin:/usr/bin:/bin \
            /opt/flutter/bin/flutter config --android-sdk /opt/android-sdk
          sudo test -s "$SDK/licenses/android-sdk-license"
          sudo test -x "$ROOTFS/usr/lib/jvm/java-17-openjdk-arm64/bin/java"
          # Normalize the JDK path expected by the engine packer and runtime manifest.
          sudo ln -sfn java-17-openjdk-arm64 "$ROOTFS/usr/lib/jvm/java-17"
          sudo test -x "$ROOTFS/usr/lib/jvm/java-17/bin/java"
          sudo test -x "$FLUTTER/bin/cache/dart-sdk/bin/dart"
          file "$FLUTTER/bin/cache/dart-sdk/bin/dart" | grep -Eqi 'ARM aarch64|ARM64'

      - name: Assemble and smoke-test the complete local engine
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME="$RUNNER_TEMP/bisho-engine"
          sudo mkdir -p "$RUNTIME/runtime"
          sudo install -m 0755 "$RUNNER_TEMP/proot-artifact/proot" "$RUNTIME/runtime/proot"
          sudo install -m 0644 "$RUNNER_TEMP/proot-artifact/BUILD_PROVENANCE.txt" "$RUNTIME/runtime/PROOT_BUILD_PROVENANCE.txt"
          sudo install -m 0644 "$RUNNER_TEMP/proot-artifact/UPSTREAM_COMMIT.txt" "$RUNTIME/runtime/PROOT_UPSTREAM_COMMIT.txt"
          sudo install -m 0644 "$RUNNER_TEMP/proot-artifact/UPSTREAM_COPYING" "$RUNTIME/runtime/PROOT_COPYING"
          sudo install -m 0755 tools/engine_bundle/validate_and_pack.sh "$RUNNER_TEMP/validate_and_pack.sh"
          # Do not recurse into rootfs: /dev and /proc are mounted there and must retain kernel ownership.
          sudo chown "$(id -u):$(id -g)" "$RUNTIME" "$RUNTIME/runtime"
          sudo chown "$(id -u):$(id -g)" "$RUNTIME/runtime/proot"
          # The packer requires these bootstrap mounts and owns their cleanup.
          sudo bash "$RUNNER_TEMP/validate_and_pack.sh" "$RUNTIME" "$RUNNER_TEMP/bisho-flutter-engine-arm64.zip"
          unzip -t "$RUNNER_TEMP/bisho-flutter-engine-arm64.zip"
          sha256sum "$RUNNER_TEMP/bisho-flutter-engine-arm64.zip" | tee "$RUNNER_TEMP/bisho-flutter-engine-arm64.zip.sha256"

      - name: Upload verified local engine bundle
        uses: actions/upload-artifact@v4.6.2
        with:
          name: Bisho-Flutter-Local-Engine-ARM64
          path: |
            ${{ runner.temp }}/bisho-flutter-engine-arm64.zip
            ${{ runner.temp }}/bisho-flutter-engine-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 14
