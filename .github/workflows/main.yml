name: Build Flutter APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter stable version'
        required: true
        default: '3.47.9'

permissions:
  contents: read
  actions: write

concurrency:
  group: bisho-ide-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Validate and build one release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout source
        uses: actions/checkout@v5.1.0

      - name: Set up Java 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ inputs.flutter_version || '3.47.9' }}
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version
          java -version
          flutter doctor -v

      - name: Cache pub packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Resolve dependencies
        run: flutter pub get

      - name: Validate Android project files
        run: |
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/gradlew
          test -f android/app/src/main/kotlin/com/bisho/myapp/MainActivity.kt
          python3 - <<'PYXML'
          import xml.etree.ElementTree as ET
          ET.parse('android/app/src/main/AndroidManifest.xml')
          ET.parse('android/app/src/main/res/values/styles.xml')
          print('Android XML validation passed')
          PYXML

      - name: Prepare build diagnostics
        if: always()
        run: mkdir -p build/diagnostics

      - name: Validate local ARM64 engine packaging contracts
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/engine_bundle/validate_and_pack.sh
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/provision-local-engine-arm64.yml"); puts "ARM64 provisioning workflow YAML: OK"'
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/provision-local-engine-arm64.yml').read_text()
          assert 'runs-on: ubuntu-24.04-arm' in workflow
          assert 'default: false' in workflow
          assert 'LICENSE_ACCEPTED' in workflow
          assert 'd8a9f9a52e5af486f80d932e838ee93861ffd863' in workflow
          assert 'a6a8d0fbc40bf42dddd88ebd336c4f5c71d638dbd760e239fff93c15445ecc84' in workflow
          assert 'validate_and_pack.sh' in workflow
          assert 'Bisho-Flutter-Local-Engine-ARM64' in workflow
          print('ARM64 provisioning safety and pin checks: PASS')
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in (
              'tools/engine_bundle/bootstrap/alpine-aarch64.json',
              'tools/engine_bundle/bootstrap/toolchain-aarch64-plan.json',
          ):
              json.loads(Path(name).read_text())
              print(f'JSON OK: {name}')
          script = Path('tools/engine_bundle/validate_and_pack.sh').read_text()
          assert 'host_proot' in script
          assert 'readelf -lW "$source_dir/runtime/proot"' in script
          assert 'readelf -lW "$host_proot"' in script
          assert '"$source_dir/runtime/proot" --version' not in script
          assert '"$source_dir/runtime/proot" -0' not in script
          print('PRoot host/Android separation checks passed')
          PY

      - name: Analyze Dart source
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-pub --no-fatal-infos 2>&1 | tee build/diagnostics/analyze.log

      - name: Run unit and widget tests
        shell: bash
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded 2>&1 | tee build/diagnostics/tests.log

      - name: Build universal release APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --no-pub 2>&1 | tee build/diagnostics/apk-build.log

      - name: Verify APK and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          APK='build/app/outputs/flutter-apk/app-release.apk'
          test -s "$APK"
          mkdir -p build/release-artifact
          cp "$APK" build/release-artifact/app-release.apk
          cd build/release-artifact
          sha256sum app-release.apk | tee SHA256SUMS.txt
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "flutter_version=$(flutter --version --machine | python3 -c 'import json,sys; print(json.load(sys.stdin)["frameworkVersion"])')"
            echo "built_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > BUILD_INFO.txt
          ls -lh app-release.apk SHA256SUMS.txt BUILD_INFO.txt

      - name: Upload release APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: Bisho-IDE-Release-APK
          path: |
            build/release-artifact/app-release.apk
            build/release-artifact/SHA256SUMS.txt
            build/release-artifact/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14

      - name: Create build diagnostics report
        if: always()
        shell: bash
        run: |
          mkdir -p build/diagnostics
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "job_status=${{ job.status }}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "finished_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo '--- Toolchain ---'
            flutter --version 2>&1 || true
            dart --version 2>&1 || true
            java -version 2>&1 || true
          } > build/diagnostics/BUILD_DIAGNOSTICS.txt
          echo "Run URL: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> build/diagnostics/BUILD_DIAGNOSTICS.txt

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: Bisho-IDE-Build-Diagnostics
          path: build/diagnostics/
          if-no-files-found: warn
          retention-days: 14
